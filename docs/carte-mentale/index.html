<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte du jeu KAGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Carte mentale plein écran : KAGE au centre, cinq branches de chaque côté,
   boîtes carrées (pixel art) au bout ; panneau de détails à droite (en bas sur téléphone). */
:root {
  --bg: #e6e8ec;          /* papier gris bleuté */
  --grid: #d5d9e1;
  --panel: #f5f6f8;
  --ink: #1a1c25;          /* encre de KAGE */
  --muted: #5a5f6e;
  --line: #c3c8d3;
  --box: #fbfbfc;
  --focus: #1f5fd1;
  --c-kage: #3f4a6b; --c-ennemis: #a3362c; --c-habitants: #3c5096; --c-monde: #4c7536; --c-potager: #94661f;
  --c-decor: #2a7471; --c-son: #74467f; --c-systemes: #826d10; --c-tech: #535e6c; --c-projet: #ad5124;
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131b; --grid: #1a1d28; --panel: #191c27; --ink: #e7e4dc; --muted: #9ba0b1; --line: #343849; --box: #1d212d; --focus: #7aa7ff;
    --c-kage: #a3b0d4; --c-ennemis: #e57a68; --c-habitants: #94a6ea; --c-monde: #8fc06e; --c-potager: #dcab5f;
    --c-decor: #6cc4bd; --c-son: #c79ed3; --c-systemes: #d9c35a; --c-tech: #aab4c2; --c-projet: #ea9663;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131b; --grid: #1a1d28; --panel: #191c27; --ink: #e7e4dc; --muted: #9ba0b1; --line: #343849; --box: #1d212d; --focus: #7aa7ff;
  --c-kage: #a3b0d4; --c-ennemis: #e57a68; --c-habitants: #94a6ea; --c-monde: #8fc06e; --c-potager: #dcab5f;
  --c-decor: #6cc4bd; --c-son: #c79ed3; --c-systemes: #d9c35a; --c-tech: #aab4c2; --c-projet: #ea9663;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- la carte ---- */
#map {
  position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#map.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#world.ease { transition: transform .45s cubic-bezier(.3,.1,.2,1); }
#links { position: absolute; left: -3000px; top: -3000px; width: 6000px; height: 6000px; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 1.5; }
#links path.trunk { stroke-width: 3; }

.node { position: absolute; }
.center {
  width: 210px; padding: 14px 16px 12px; text-align: left; cursor: pointer;
  background: var(--ink); color: var(--bg); border: 0;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end;
}
.center img { grid-row: span 2; width: 66px; height: 69px; image-rendering: pixelated; display: block; }
.center b { font: 700 30px/1 var(--f-pixel); letter-spacing: .04em; }
.center span { font: 12px/1.3 var(--f-body); opacity: .75; }

.hub {
  width: 168px; padding: 9px 12px; border: 0; cursor: pointer; text-align: left;
  background: var(--c); color: var(--bg);
  font: 700 16px/1.15 var(--f-pixel); letter-spacing: .02em;
}
.hub small { display: block; font: 500 11px/1.3 var(--f-body); letter-spacing: 0; opacity: .85; margin-top: 3px; }

.leaf {
  width: 196px; min-height: 52px; padding: 7px 9px 7px 10px; cursor: pointer; text-align: left;
  background: var(--box); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line));
  display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: start;
  transition: transform .15s ease, border-color .15s ease, opacity .2s ease;
}
.leaf:hover { border-color: var(--c); transform: translateY(-1px); }
.leaf .t { font: 700 13.5px/1.25 var(--f-body); min-width: 0; }
.leaf .d { grid-column: 1 / -1; font: 12px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.leaf .spr { image-rendering: pixelated; height: 26px; width: auto; margin: -3px -3px -6px 0; }
.leaf.sel { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.leaf.dim, .hub.dim { opacity: .18; }
.leaf.hit { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

/* pastilles d'état : la forme dit l'état */
.st { width: 10px; height: 10px; margin-top: 4px; display: inline-block; flex: none; }
.st[data-s="fait"] { background: var(--c, var(--ink)); }
.st[data-s="encours"] { background: linear-gradient(90deg, var(--c, var(--ink)) 50%, transparent 50%); border: 1.5px solid var(--c, var(--ink)); }
.st[data-s="provisoire"] { border: 1.5px dashed var(--c, var(--ink)); }
.st[data-s="afaire"] { border: 1.5px solid var(--c, var(--ink)); }
.st[data-s="idee"] { border: 1.5px dotted var(--muted); border-radius: 50%; }

/* ---- bandeau du haut ---- */
.top {
  position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; }
.brand h1 { margin: 0; font: 700 18px/1.1 var(--f-pixel); letter-spacing: .03em; }
.brand p { margin: 2px 0 0; font: 11.5px/1.3 var(--f-mono); color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 0 10px; height: 38px; min-width: 0; flex: 0 1 300px; }
.search input { border: 0; background: transparent; color: var(--ink); font: 14px var(--f-body); width: 100%; min-width: 0; height: 100%; outline: none; }
.search:focus-within { border-color: var(--focus); }
.search output { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.legend {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 150px);
}
.legend button {
  display: inline-flex; gap: 7px; align-items: center; padding: 5px 9px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; --c: var(--ink);
}
.legend button .st { margin: 0; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.legend button em { font: normal 11px var(--f-mono); color: var(--muted); }

.zoom {
  position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--panel);
}
.zoom button { width: 40px; height: 38px; border: 0; background: transparent; cursor: pointer; font: 700 18px var(--f-pixel); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--bg); }
.zoom .fit { font: 600 11px var(--f-body); }

/* ---- panneau de détails ---- */
#panel {
  position: fixed; z-index: 10; top: 0; right: 0; bottom: 0; width: min(400px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; overscroll-behavior: contain;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px;
}
#panel .close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: 36px; height: 36px; border: 1px solid var(--line); background: var(--box); cursor: pointer; font-size: 18px; }
#panel .eyebrow { font: 700 12px/1 var(--f-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
#panel h2 { margin: 8px 44px 10px 0; font: 700 23px/1.15 var(--f-body); text-wrap: balance; }
#panel .chip { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); }
#panel .hero { display: flex; gap: 12px; margin: 14px 0 4px; align-items: flex-end; }
#panel .hero img { image-rendering: pixelated; height: 96px; width: auto; background: var(--bg); padding: 8px; }
#panel p.txt { margin: 14px 0 0; max-width: 62ch; }
#panel h3 { margin: 22px 0 8px; font: 700 11.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
#panel ul.keys li { padding-left: 14px; position: relative; font-size: 14px; }
#panel ul.keys li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; background: var(--c); }
#panel ul.files a { font: 12.5px/1.35 var(--f-mono); color: var(--ink); word-break: break-all; text-decoration: none; border-bottom: 1px solid var(--line); }
#panel ul.files a:hover { border-color: var(--c); }
#panel ul.files span { font: 12px var(--f-body); color: var(--muted); }
#panel ul.files a.lk { font: 14px/1.35 var(--f-body); }
#panel .see { display: flex; flex-wrap: wrap; gap: 6px; }
#panel .see button { border: 1px solid var(--line); background: var(--box); padding: 4px 9px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
#panel .see button:hover { border-color: var(--c); }

@media (max-width: 640px) {
  .brand p { display: none; }
  .search { flex: 1 1 100%; }
  .legend { max-width: calc(100% - 80px); }
  .legend button em { display: none; }
  #panel { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: 18px; }
  #panel .close { top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #world.ease, .leaf { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Carte du jeu KAGE</h1>
    <p id="etat">état au 5 nov. 2026</p>
  </div>
  <label class="search" for="q">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 1a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm4.6 7.7 3.9 3.9-1.4 1.4-3.9-3.9z" fill="currentColor"/></svg>
    <input id="q" type="search" placeholder="Chercher (dash, grange, sfx.js…)" autocomplete="off" aria-label="Chercher un élément du jeu">
    <output id="count"></output>

</header>

<main id="map" aria-label="Carte mentale du jeu">
  <div id="world">
    <svg id="links" viewBox="-3000 -3000 6000 6000" aria-hidden="true"></svg>
  </div>
</main>

<nav class="legend" id="legend" aria-label="Filtrer par état"></nav>

<div class="zoom" role="group" aria-label="Zoom">

  <button type="button" id="zout" aria-label="Dézoomer">−</button>
  <button type="button" id="zfit" class="fit" aria-label="Voir toute la carte">Tout</button>
</div>

<aside id="panel" hidden aria-live="polite"></aside>

  { id: 'hab-koi', t: 'Koïs du bassin', s: 'fait', d: 'Jardin des sentinelles',

{ id: 'monde', side: 'R', t: 'Le monde', sub: 'sept chapitres, un seul voyage', color: 'monde', leaves: [
  { id: 'monde-principe', t: 'Un monde unique', s: 'fait', d: 'Décision de Raph : pas de niveaux séparés',
    txt: "Un seul monde continu, parcouru d'ouest en est, sans menu de niveaux. Rythme d'un jeu de plateforme rapide et exigeant, avec des passages secondaires facultatifs vers des secrets. Aucune mécanique ne se débloque : KAGE a tout dès le début ; ce sont les attributs qui progressent. Retour en arrière libre.",
    keys: ['Environ 20 minutes par chapitre', 'Une zone = une idée de gameplay', 'Lanternes = reprise et sauvegarde'],
    files: ['docs/MONDE.md'], links: [['Carte du monde', 'docs/monde/carte_du_monde.png']] },
  { id: 'monde-ch1', t: '1 · Le Potager', s: 'fait', d: 'Jouable et entièrement peint',
    txt: "Jour, champs, paille, montagnes au loin. 9 zones, 9 lanternes, le marchand, puis le mini-boss KARASU-KASHI et la porte du temple. Voir la branche « Chapitre 1 ».", files: ['src/game/chapters/potager.js'], see: ['pot-z01'] },
  { id: 'monde-ch2', t: '2 · Le champ des bambous', s: 'afaire', d: 'Rizières, bambous, eau', txt: "Ennemi à concevoir. Marchand au bord des rizières.", files: ['docs/MONDE.md'] },
  { id: 'monde-ch3', t: '3 · La forêt des grands arbres', s: 'afaire', d: 'Troncs immenses, brume', txt: "Ennemi pressenti : Kage-mane. Marchand dans une clairière.", see: ['ennemi-kagemane'] },
  { id: 'monde-ch4', t: '4 · Le village des basses montagnes', s: 'afaire', d: 'Toits, lanternes, marché', txt: "Ennemi pressenti : Chōchin. Marchand au marché.", see: ['ennemi-chochin'] },
  { id: 'monde-ch5', t: '5 · Les hautes montagnes', s: 'afaire', d: 'Vent, neige, glace, ascension', txt: "Ennemi pressenti : un corbeau messager. Marchand dans un refuge.", see: ['ennemi-messager'] },
  { id: 'monde-ch6', t: '6 · Le temple de pierre', s: 'afaire', d: 'Pierre, mousse, or terni', txt: "Mini-boss pressenti : Ishi. Marchand devant le temple.", see: ['ennemi-ishi'] },
  { id: 'monde-ch7', t: '7 · Le dojo final', s: 'afaire', d: 'L\'épreuve ultime', txt: "Tous les ennemis, combinés. On le devine déjà sur l'épaule du Mont Kagero, au fond du Potager.", see: ['decor-backdrop'] },
  { id: 'monde-histoire', t: 'Le fil des talismans', s: 'idee', d: 'Histoire en fond, à confirmer',
    txt: "Proposition : quelqu'un pose des talismans maudits qui réveillent gardiens, mannequins et objets du pays ; KAGE remonte la piste jusqu'au dojo. Pas de longs dialogues : l'histoire se lit dans le décor. Question encore ouverte.", see: ['proj-questions'] },
  { id: 'monde-niveau1', t: 'Niveau 1 (ancien)', s: 'fait', d: 'Adresse #niveau-1',
    txt: "170×22 carreaux qui demandent toutes les mécaniques : tunnel bas, fossés de 5 et 8, puits à sauts muraux, gong au shuriken, arène, pics, torii d'arrivée ; 5 WARA, plusieurs TATE, 3 lanternes, chronomètre et écran de fin.",
    files: ['src/game/maps.js', 'src/game/level.js'] },
  { id: 'monde-terrain', t: 'Terrain d\'essai', s: 'fait', d: 'Adresse #terrain',
    txt: "Long sol plat, un puits et un mur isolé pour le saut mural, un TATE et un WARA. Sert à essayer les mouvements.", files: ['src/game/maps.js'] },
  { id: 'monde-carte', t: 'Carte du monde', s: 'fait', d: 'Schéma des 7 chapitres',
    txt: "Carte schématique dessinée par un script Python.", files: ['tools/monde_carte.py'], links: [['Voir la carte', 'docs/monde/carte_du_monde.png']] },
]},
{ id: 'potager', side: 'R', t: 'Chapitre 1 · Le Potager', sub: '9 zones, 548 × 22 cases', color: 'potager', leaves: [

  { id: 'pot-z04', t: '04 · Le vieux verger', s: 'fait', d: 'Premiers WARA, coup de pied',
    txt: "Arbres fruitiers tortueux de tailles variées, plantés au sol (la voûte de branches, qui flottait sur les écrans hauts, a été retirée), grosse branche praticable dans un grand cerisier. Premiers ennemis et apprentissage du coup de pied.",

  { id: 'pot-z06', t: '06 · La grange abandonnée', s: 'fait', d: 'Caisses à briser au sabre',

  { id: 'pot-z08', t: '08 · Le comptoir du voyageur', s: 'fait', d: 'Le marchand, puis la route des collines',

  { id: 'pot-z09', t: '09 · Le champ du corbeau', s: 'fait', d: 'Le mini-boss, puis la porte du temple',
    txt: "Arène plate : lanterne à l'entrée, navets, choux et radis, l'épouvantail géant où trône KARASU-KASHI. Au bout, la grande porte du temple (vermillon, toit de tuiles, corde sacrée, talisman) reste fermée tant qu'il n'est pas vaincu ; derrière, la sortie du chapitre.",
    files: ['src/game/chapters/potager.js#L433', 'src/game/potager/props.js', 'src/game/potager/live.js'], links: [['Porte ouverte', 'docs/enemies/karasu_porte_ouverte.png']], see: ['ennemi-karasu'] },
  { id: 'pot-reste', t: 'Ce qui reste du script', s: 'afaire', d: 'Planches, ambiance, lumière',

    files: ['docs/REPRISE.md'], see: ['proj-suite', 'son-ambiance'] },
]},

// ===========================================================================
// Mise en page et interactions
// ===========================================================================
const REPO = 'https://github.com/Raphgh31/ninja-video-game/blob/main/';
const STATES = {
  fait: 'Fait', encours: 'En cours', provisoire: 'Provisoire', afaire: 'À faire', idee: 'Idée',
};
const $ = (s, el = document) => el.querySelector(s);
const world = $('#world'), map = $('#map'), svg = $('#links'), panel = $('#panel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const LEAF_W = 196, LEAF_H = 58, GAP_X = 10, GAP_Y = 10, HUB_W = 168, HUB_X = 300, LEAF_X = 520, BRANCH_GAP = 46;
const byId = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// --- centre ---
const center = document.createElement('button');
center.type = 'button';
center.className = 'node center';
center.innerHTML = `<img alt="KAGE" src="${SPRITES.kage[0]}"><b>KAGE</b><span>jeu de plateforme ninja · ${BRANCHES.reduce((n, b) => n + b.leaves.length, 0)} éléments</span>`;
world.appendChild(center);
const CW = 210, CH = 95;
center.style.left = -CW / 2 + 'px'; center.style.top = -CH / 2 + 'px';
if (!reduce) { let f = 0; const img = $('img', center); setInterval(() => { f = (f + 1) % 4; img.src = SPRITES.kage[f]; }, 170); }

// --- branches : on crée les boîtes, on mesure leur hauteur, puis on les range ---
function path(d, color, cls) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('stroke', color);
  if (cls) p.setAttribute('class', cls);
  svg.appendChild(p); return p;
}
BRANCHES.forEach(b => {
  const col = `var(--c-${b.color})`;
  b.el = document.createElement('button');
  b.el.type = 'button'; b.el.className = 'node hub';
  b.el.style.setProperty('--c', col);
  b.el.innerHTML = `${esc(b.t)}<small>${esc(b.sub)}</small>`;
  b.el.addEventListener('click', () => focusBranch(b));
  world.appendChild(b.el);
  b.leaves.forEach(l => {
    l.branch = b; byId[l.id] = l;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'node leaf'; el.id = 'n-' + l.id;
    el.style.setProperty('--c', col);
    const spr = l.spr && sprite(l.spr);
    el.innerHTML = `<span class="t">${esc(l.t)}</span>${spr ? `<img class="spr" alt="" src="${spr}">` : `<span class="st" data-s="${l.s}" title="${STATES[l.s]}"></span>`}<span class="d">${esc(l.d)}</span>`;
    if (spr) el.setAttribute('aria-label', `${l.t}, ${STATES[l.s]}`);
    el.addEventListener('click', () => open(l));
    world.appendChild(el);
    l.el = el;
  });
});
function layout() {
  svg.replaceChildren();
  BRANCHES.forEach(b => b.leaves.forEach(l => { l.el.style.height = ''; }));
  ['R', 'L'].forEach(side => {
    const list = BRANCHES.filter(b => b.side === side);
    list.forEach(b => {
      b.cols = b.leaves.length > 3 ? 2 : 1;
      b.rowH = [];
      b.leaves.forEach((l, i) => { const r = Math.floor(i / b.cols); b.rowH[r] = Math.max(b.rowH[r] || 0, l.el.offsetHeight); });
      b.h = b.rowH.reduce((n, h) => n + h, 0) + GAP_Y * (b.rowH.length - 1);
    });
    const total = list.reduce((n, b) => n + b.h, 0) + BRANCH_GAP * (list.length - 1);
    let y = -total / 2;
    list.forEach(b => { b.y0 = y; b.cy = y + b.h / 2; y += b.h + BRANCH_GAP; });
  });
  BRANCHES.forEach(b => {
    const dir = b.side === 'R' ? 1 : -1, col = `var(--c-${b.color})`;
    const hubH = b.el.offsetHeight;
    b.el.style.left = (dir > 0 ? HUB_X : -HUB_X - HUB_W) + 'px';
    b.el.style.top = (b.cy - hubH / 2) + 'px';
    const sx = dir * CW / 2, ex = dir > 0 ? HUB_X : -HUB_X, mx = (sx + ex) / 2;
    b.trunk = path(`M${sx} 0 C${mx} 0 ${mx} ${b.cy} ${ex} ${b.cy}`, col, 'trunk');
    const hubOut = dir > 0 ? HUB_X + HUB_W : -HUB_X - HUB_W;
    const inner = dir > 0 ? LEAF_X : -LEAF_X, m2 = (hubOut + inner) / 2;
    let ry = b.y0;
    b.rowH.forEach((h, r) => {
      // une brindille par rangée, jusqu'à la boîte intérieure ; la boîte extérieure lui fait suite
      const ty = ry + h / 2;
      const tw = path(`M${hubOut} ${b.cy} C${m2} ${b.cy} ${m2} ${ty} ${inner} ${ty}`, col);
      tw.setAttribute('stroke-opacity', '.55');
      b.leaves.slice(r * b.cols, r * b.cols + b.cols).forEach((l, c) => {
        l.x = dir > 0 ? LEAF_X + c * (LEAF_W + GAP_X) : -LEAF_X - LEAF_W - c * (LEAF_W + GAP_X);
        l.y = ry; l.h = h; l.twig = tw;
        l.el.style.left = l.x + 'px'; l.el.style.top = l.y + 'px'; l.el.style.height = h + 'px';
      });
      ry += h + GAP_Y;
    });
  });
}
layout();
function sprite(k) { return k === 'kage0' ? SPRITES.kage[0] : SPRITES[k]; }

// --- vue : déplacement et zoom ---
const view = { x: 0, y: 0, k: 1 };
function apply(ease) {
  world.classList.toggle('ease', !!ease && !reduce);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}
const clampK = k => Math.min(2.4, Math.max(0.18, k));
function zoomAt(px, py, f, ease) {
  const k = clampK(view.k * f); f = k / view.k;
  view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.k = k; apply(ease);
}
function bounds() {
  const B = { x0: -CW / 2, x1: CW / 2, y0: -CH / 2, y1: CH / 2 };
  BRANCHES.forEach(b => b.leaves.forEach(l => { B.x0 = Math.min(B.x0, l.x); B.x1 = Math.max(B.x1, l.x + LEAF_W); B.y0 = Math.min(B.y0, l.y); B.y1 = Math.max(B.y1, l.y + l.h); }));
  return B;
}
function fitTo(B, ease, maxK = 1.2) {
  const W = innerWidth, H = innerHeight;
  const top = $('.top').getBoundingClientRect().bottom + 12, bottom = 70;
  const avW = W - 32 - (panel.hidden || W <= 640 ? 0 : 400), avH = H - top - bottom - (!panel.hidden && W <= 640 ? H * .62 : 0);
  const k = clampK(Math.min(avW / (B.x1 - B.x0), avH / (B.y1 - B.y0), maxK));
  view.k = k;
  view.x = 16 + avW / 2 - (B.x0 + B.x1) / 2 * k;
  view.y = top + avH / 2 - (B.y0 + B.y1) / 2 * k;
  apply(ease);
}
function fitAll(ease) { fitTo(bounds(), ease); }
function focusBranch(b) {
  const xs = b.leaves.map(l => l.x), ys = b.leaves.map(l => l.y);
  const hx = b.side === 'R' ? HUB_X : -HUB_X - HUB_W;
  fitTo({ x0: Math.min(hx, ...xs) - 10, x1: Math.max(hx + HUB_W, ...xs.map(x => x + LEAF_W)) + 10, y0: Math.min(...ys) - 10, y1: Math.max(...b.leaves.map(l => l.y + l.h)) + 10 }, true, 1.6);
}
function reveal(l) {
  const W = innerWidth, H = innerHeight, narrow = W <= 640;
  const r = l.el.getBoundingClientRect();
  const maxX = narrow ? W : W - 400, maxY = narrow ? H * .38 : H;
  const topY = $('.top').getBoundingClientRect().bottom;
  if (view.k < .75) { // trop petit pour lire : on rapproche
    const k = 1; const cx = l.x + LEAF_W / 2, cy = l.y + l.h / 2;
    view.k = k; view.x = maxX / 2 - cx * k; view.y = (topY + maxY) / 2 - cy * k; apply(true); return;
  }
  if (r.left < 8 || r.right > maxX - 8 || r.top < topY + 4 || r.bottom > maxY - 8) {
    view.x += (maxX / 2) - (r.left + r.right) / 2; view.y += (topY + maxY) / 2 - (r.top + r.bottom) / 2; apply(true);
  }
}

// glisser, molette, pincer
const pts = new Map(); let drag = null, moved = false, pinch = null;
map.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; drag = null; moved = true; }
});
addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.k * d / pinch.d) / view.k);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; map.classList.add('dragging'); }
    if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
  }
});
function up(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) { drag = null; map.classList.remove('dragging'); }
}
addEventListener('pointerup', up); addEventListener('pointercancel', up);
map.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
map.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.0016);
  zoomAt(e.clientX, e.clientY, f);
}, { passive: false });
$('#zin').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.3, true);
$('#zout').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.3, true);
$('#zfit').onclick = () => fitAll(true);
center.addEventListener('click', () => fitAll(true));

// --- panneau de détails ---
let current = null;
function fileLink(f) {
  const [p, line] = f.split('#');
  const label = p + (line ? ' · ligne ' + line.slice(1) : '');
  return `<li><a href="${REPO + p + (line ? '#' + line : '')}" target="_blank" rel="noopener">${esc(label)}</a></li>`;
}
function open(l) {
  if (current) current.el.classList.remove('sel');
  current = l; l.el.classList.add('sel');
  const b = l.branch;
  panel.style.setProperty('--c', `var(--c-${b.color})`);
  const spr = l.spr && sprite(l.spr);
  const links = (l.links || []).map(([t, u]) => `<li><a class="lk" href="${/^https?:/.test(u) ? u : REPO + u}" target="_blank" rel="noopener">${esc(t)}</a> <span>${/^https?:/.test(u) ? '' : esc(u)}</span></li>`).join('');
  const see = (l.see || []).filter(id => byId[id]).map(id => `<button type="button" data-go="${id}" style="--c: var(--c-${byId[id].branch.color})"><span class="st" data-s="${byId[id].s}"></span>${esc(byId[id].t)}</button>`).join('');
  panel.innerHTML = `
    <button type="button" class="close" aria-label="Fermer">×</button>
    <div class="eyebrow">${esc(b.t)}</div>
    <h2>${esc(l.t)}</h2>
    <div class="chip"><span class="st" data-s="${l.s}"></span>${STATES[l.s]} · ${esc(l.d)}</div>
    ${spr ? `<div class="hero"><img alt="${esc(l.t)}" src="${spr}"></div>` : ''}
    <p class="txt">${esc(l.txt || '')}</p>
    ${l.keys && l.keys.length ? `<h3>Repères</h3><ul class="keys">${l.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${l.files && l.files.length ? `<h3>Fichiers</h3><ul class="files">${l.files.map(fileLink).join('')}</ul>` : ''}
    ${links ? `<h3>Images et liens</h3><ul class="files">${links}</ul>` : ''}
    ${see ? `<h3>Voir aussi</h3><div class="see">${see}</div>` : ''}`;
  panel.hidden = false;
  panel.scrollTop = 0;
  $('.close', panel).onclick = close;
  panel.querySelectorAll('[data-go]').forEach(btn => btn.onclick = () => { const t = byId[btn.dataset.go]; open(t); t.el.focus({ preventScroll: true }); });
  try { history.replaceState(null, '', '#' + l.id); } catch (e) {}
  requestAnimationFrame(() => reveal(l));
}
function close() {
  panel.hidden = true;
  if (current) { current.el.classList.remove('sel'); current.el.focus({ preventScroll: true }); current = null; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) close(); });

// --- recherche et filtres d'état ---
const active = new Set();
const legend = $('#legend');
const counts = {};
BRANCHES.forEach(b => b.leaves.forEach(l => counts[l.s] = (counts[l.s] || 0) + 1));
Object.entries(STATES).forEach(([s, label]) => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.setAttribute('aria-pressed', 'false');
  btn.innerHTML = `<span class="st" data-s="${s}"></span>${label} <em>${counts[s] || 0}</em>`;
  btn.onclick = () => { active.has(s) ? active.delete(s) : active.add(s); btn.setAttribute('aria-pressed', active.has(s)); filter(); };
  legend.appendChild(btn);
});
const q = $('#q'), count = $('#count');
function matches(l, words) {
  if (active.size && !active.has(l.s)) return false;
  if (!words.length) return true;
  const hay = l._hay || (l._hay = norm([l.t, l.d, l.txt, l.branch.t, ...(l.keys || []), ...(l.files || [])].join(' ')));
  return words.every(w => hay.includes(w));
}
function filter() {
  const words = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  const on = words.length || active.size;
  let n = 0;
  BRANCHES.forEach(b => {
    let any = false;
    b.leaves.forEach(l => {
      const m = matches(l, words); if (m) { n++; any = true; }
      l.el.classList.toggle('dim', on && !m);
      l.el.classList.toggle('hit', !!words.length && m);
      l.twig.style.opacity = on && !m ? .15 : '';
    });
    b.el.classList.toggle('dim', on && !any);
    b.trunk.style.opacity = on && !any ? .15 : '';
  });
  count.textContent = on ? `${n} trouvé${n > 1 ? 's' : ''}` : '';
  return n;
}
q.addEventListener('input', filter);
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = BRANCHES.flatMap(b => b.leaves).find(l => !l.el.classList.contains('dim'));
  if (first) { open(first); first.el.focus({ preventScroll: true }); }
});

// --- démarrage ---
fitAll(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); filter(); if (!current) fitAll(false); });
const start = location.hash.slice(1);
if (byId[start]) open(byId[start]);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => current ? reveal(current) : fitAll(false), 150); });
</script>
</body>
</html>
