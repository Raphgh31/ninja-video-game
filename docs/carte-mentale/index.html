<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte du jeu KAGE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Carte mentale plein écran : KAGE au centre, cinq branches de chaque côté,
   boîtes carrées (pixel art) au bout ; panneau de détails à droite (en bas sur téléphone). */
:root {
  --bg: #e6e8ec;          /* papier gris bleuté */
  --grid: #d5d9e1;
  --panel: #f5f6f8;
  --ink: #1a1c25;          /* encre de KAGE */
  --muted: #5a5f6e;
  --line: #c3c8d3;
  --box: #fbfbfc;
  --focus: #1f5fd1;
  --c-kage: #3f4a6b; --c-ennemis: #a3362c; --c-habitants: #3c5096; --c-monde: #4c7536; --c-potager: #94661f;
  --c-decor: #2a7471; --c-son: #74467f; --c-systemes: #826d10; --c-tech: #535e6c; --c-projet: #ad5124;
  --f-pixel: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131b; --grid: #1a1d28; --panel: #191c27; --ink: #e7e4dc; --muted: #9ba0b1; --line: #343849; --box: #1d212d; --focus: #7aa7ff;
    --c-kage: #a3b0d4; --c-ennemis: #e57a68; --c-habitants: #94a6ea; --c-monde: #8fc06e; --c-potager: #dcab5f;
    --c-decor: #6cc4bd; --c-son: #c79ed3; --c-systemes: #d9c35a; --c-tech: #aab4c2; --c-projet: #ea9663;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131b; --grid: #1a1d28; --panel: #191c27; --ink: #e7e4dc; --muted: #9ba0b1; --line: #343849; --box: #1d212d; --focus: #7aa7ff;
  --c-kage: #a3b0d4; --c-ennemis: #e57a68; --c-habitants: #94a6ea; --c-monde: #8fc06e; --c-potager: #dcab5f;
  --c-decor: #6cc4bd; --c-son: #c79ed3; --c-systemes: #d9c35a; --c-tech: #aab4c2; --c-projet: #ea9663;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- la carte ---- */
#map {
  position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#map.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#world.ease { transition: transform .45s cubic-bezier(.3,.1,.2,1); }
#links { position: absolute; left: -3000px; top: -3000px; width: 6000px; height: 6000px; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke-width: 1.5; }
#links path.trunk { stroke-width: 3; }

.node { position: absolute; }
.center {
  width: 210px; padding: 14px 16px 12px; text-align: left; cursor: pointer;
  background: var(--ink); color: var(--bg); border: 0;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end;
}
.center img { grid-row: span 2; width: 66px; height: 69px; image-rendering: pixelated; display: block; }
.center b { font: 700 30px/1 var(--f-pixel); letter-spacing: .04em; }
.center span { font: 12px/1.3 var(--f-body); opacity: .75; }

.hub {
  width: 168px; padding: 9px 12px; border: 0; cursor: pointer; text-align: left;
  background: var(--c); color: var(--bg);
  font: 700 16px/1.15 var(--f-pixel); letter-spacing: .02em;
}
.hub small { display: block; font: 500 11px/1.3 var(--f-body); letter-spacing: 0; opacity: .85; margin-top: 3px; }

.leaf {
  width: 196px; min-height: 52px; padding: 7px 9px 7px 10px; cursor: pointer; text-align: left;
  background: var(--box); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line));
  display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: start;
  transition: transform .15s ease, border-color .15s ease, opacity .2s ease;
}
.leaf:hover { border-color: var(--c); transform: translateY(-1px); }
.leaf .t { font: 700 13.5px/1.25 var(--f-body); min-width: 0; }
.leaf .d { grid-column: 1 / -1; font: 12px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }
.leaf .spr { image-rendering: pixelated; height: 26px; width: auto; margin: -3px -3px -6px 0; }
.leaf.sel { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.leaf.dim, .hub.dim { opacity: .18; }
.leaf.hit { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

/* pastilles d'état : la forme dit l'état */
.st { width: 10px; height: 10px; margin-top: 4px; display: inline-block; flex: none; }
.st[data-s="fait"] { background: var(--c, var(--ink)); }
.st[data-s="encours"] { background: linear-gradient(90deg, var(--c, var(--ink)) 50%, transparent 50%); border: 1.5px solid var(--c, var(--ink)); }
.st[data-s="provisoire"] { border: 1.5px dashed var(--c, var(--ink)); }
.st[data-s="afaire"] { border: 1.5px solid var(--c, var(--ink)); }
.st[data-s="idee"] { border: 1.5px dotted var(--muted); border-radius: 50%; }

/* ---- bandeau du haut ---- */
.top {
  position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; }
.brand h1 { margin: 0; font: 700 18px/1.1 var(--f-pixel); letter-spacing: .03em; }
.brand p { margin: 2px 0 0; font: 11.5px/1.3 var(--f-mono); color: var(--muted); }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 0 10px; height: 38px; min-width: 0; flex: 0 1 300px; }
.search input { border: 0; background: transparent; color: var(--ink); font: 14px var(--f-body); width: 100%; min-width: 0; height: 100%; outline: none; }
.search:focus-within { border-color: var(--focus); }
.search output { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.legend {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 150px);
}
.legend button {
  display: inline-flex; gap: 7px; align-items: center; padding: 5px 9px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; --c: var(--ink);
}
.legend button .st { margin: 0; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.legend button em { font: normal 11px var(--f-mono); color: var(--muted); }

.zoom {
  position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--panel);
}
.zoom button { width: 40px; height: 38px; border: 0; background: transparent; cursor: pointer; font: 700 18px var(--f-pixel); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--bg); }
.zoom .fit { font: 600 11px var(--f-body); }

/* ---- panneau de détails ---- */
#panel {
  position: fixed; z-index: 10; top: 0; right: 0; bottom: 0; width: min(400px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; overscroll-behavior: contain;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 22px;
}
#panel .close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); width: 36px; height: 36px; border: 1px solid var(--line); background: var(--box); cursor: pointer; font-size: 18px; }
#panel .eyebrow { font: 700 12px/1 var(--f-pixel); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
#panel h2 { margin: 8px 44px 10px 0; font: 700 23px/1.15 var(--f-body); text-wrap: balance; }
#panel .chip { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; color: var(--muted); }
#panel .hero { display: flex; gap: 12px; margin: 14px 0 4px; align-items: flex-end; }
#panel .hero img { image-rendering: pixelated; height: 96px; width: auto; background: var(--bg); padding: 8px; }
#panel p.txt { margin: 14px 0 0; max-width: 62ch; }
#panel h3 { margin: 22px 0 8px; font: 700 11.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
#panel ul.keys li { padding-left: 14px; position: relative; font-size: 14px; }
#panel ul.keys li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; background: var(--c); }
#panel ul.files a { font: 12.5px/1.35 var(--f-mono); color: var(--ink); word-break: break-all; text-decoration: none; border-bottom: 1px solid var(--line); }
#panel ul.files a:hover { border-color: var(--c); }
#panel ul.files span { font: 12px var(--f-body); color: var(--muted); }
#panel ul.files a.lk { font: 14px/1.35 var(--f-body); }
#panel .see { display: flex; flex-wrap: wrap; gap: 6px; }
#panel .see button { border: 1px solid var(--line); background: var(--box); padding: 4px 9px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
#panel .see button:hover { border-color: var(--c); }

@media (max-width: 640px) {
  .brand p { display: none; }
  .search { flex: 1 1 100%; }
  .legend { max-width: calc(100% - 80px); }
  .legend button em { display: none; }
  #panel { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: 18px; }
  #panel .close { top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  #world.ease, .leaf { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Carte du jeu KAGE</h1>
    <p id="etat">état au 12 nov. 2026</p>
  </div>
  <label class="search" for="q">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 1a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm4.6 7.7 3.9 3.9-1.4 1.4-3.9-3.9z" fill="currentColor"/></svg>
    <input id="q" type="search" placeholder="Chercher (dash, grange, sfx.js…)" autocomplete="off" aria-label="Chercher un élément du jeu">
    <output id="count"></output>
  </label>
</header>

<main id="map" aria-label="Carte mentale du jeu">
  <div id="world">
    <svg id="links" viewBox="-3000 -3000 6000 6000" aria-hidden="true"></svg>
  </div>
</main>

<nav class="legend" id="legend" aria-label="Filtrer par état"></nav>

<div class="zoom" role="group" aria-label="Zoom">
  <button type="button" id="zin" aria-label="Zoomer">+</button>
  <button type="button" id="zout" aria-label="Dézoomer">−</button>
  <button type="button" id="zfit" class="fit" aria-label="Voir toute la carte">Tout</button>
</div>

<aside id="panel" hidden aria-live="polite"></aside>

  { id: 'ennemi-karasu', t: 'KARASU-KASHI', s: 'fait', d: 'Mini-boss du Potager, le corbeau au grand chapeau', spr: 'karasu',
    txt: "Grand corbeau d'encre aux reflets pétrole, coiffé d'un sugegasa de paille beaucoup trop grand, perché sur un épouvantail géant dans la zone 9. Refondu en novembre 2026 : il va chercher des pierres (petites, moyennes, grosses) sur deux tas de l'arène, les saisit dans ses serres (pattes tendues, doigts refermés sur la pierre : images carry_ et open_) et les lâche au-dessus de KAGE (ombre au sol ; un peu plus difficile depuis les retouches : chute plus rapide, lâcher plus court, un peu d'avance sur la course de KAGE, les grosses roulent plus loin). Il vole deux fois plus haut (76 px) : hors de portée depuis le sol. Depuis les plateformes de bois fragiles, un saut + sabre le fait tomber, bec planté ; sa chute effondre toutes les plateformes. Ensuite seulement, il plonge : il prend de la hauteur, décrit un arc et fond sur KAGE (on passe dessous en glissade). Planté, le sabre et le coup de pied le blessent. Vaincu, il ouvre la porte du temple. À régler en jouant.",
    keys: ['24 PV, trois paliers (66 %, 33 %)', '3, 3 puis 4 pierres par sortie, 1 dégât chacune', 'Plongeon en arc (seulement plateformes tombées) : 2 dégâts debout, rien en glissade', 'Planté 2,9 → 2,3 s ; défaite sauvegardée'],
    files: ['src/game/karasu.js', 'tools/kage_forge/enemies/karasu.py', 'tools/kage_forge/enemies/build_karasu.py', 'tools/kage_forge/enemies/karasu_board.py', 'docs/enemies/README.md'],
    links: [['Planche de design', 'docs/enemies/karasu_design.png'], ['Poses', 'docs/enemies/karasu_poses.png'], ['Combat', 'docs/enemies/karasu_combat.gif'], ['Serres et pierres', 'docs/enemies/karasu_serres.png']], see: ['pot-z09'] },
  { id: 'ennemi-messager', t: 'Corbeau messager', s: 'idee', d: 'Obstacle rapide des hautes montagnes',
    txt: "Ennemi proposé pour les hautes montagnes (chapitre 5), cousin de KARASU-KASHI. Pas commencé.", see: ['monde-ch5', 'ennemi-karasu'] },
  { id: 'ennemi-ishi', t: 'Ishi', s: 'idee', d: 'Sumo de pierre, mini-boss à onde de choc',
    txt: "Mini-boss proposé pour le temple de pierre (chapitre 6). Pas commencé.", see: ['monde-ch6'] },
  { id: 'ennemi-chute', t: 'Chute dans le vide', s: 'fait', d: 'Règle commune aux ennemis',
    txt: "En marchant, les ennemis évitent toujours le vide d'eux-mêmes. Poussés par le coup de pied, ils tombent : sur des pics ou hors du niveau ils sont vaincus, sur un sol plus bas ils reprennent le combat.",

    files: ['src/game/potager/live.js', 'src/game/shop.js'], see: ['sys-boutique', 'proj-suite', 'pot-z08'] },

{ id: 'monde', side: 'R', t: 'Le monde', sub: 'sept chapitres, un seul voyage', color: 'monde', leaves: [
  { id: 'monde-principe', t: 'Un monde unique', s: 'fait', d: 'Décision de Raph : pas de niveaux séparés',
    txt: "Un seul monde continu, parcouru d'ouest en est, sans menu de niveaux. Rythme d'un jeu de plateforme rapide et exigeant, avec des passages secondaires facultatifs vers des secrets. Aucune mécanique ne se débloque : KAGE a tout dès le début ; ce sont les attributs qui progressent. Retour en arrière libre.",
    keys: ['Environ 20 minutes par chapitre', 'Une zone = une idée de gameplay', 'Lanternes = reprise et sauvegarde'],
    files: ['docs/MONDE.md'], links: [['Carte du monde', 'docs/monde/carte_du_monde.png']] },
  { id: 'monde-ch1', t: '1 · Le Potager', s: 'fait', d: 'Jouable et entièrement peint',
    txt: "Jour, champs, paille, montagnes au loin. 9 zones, 9 lanternes, le marchand, puis le mini-boss KARASU-KASHI et la porte du temple. Voir la branche « Chapitre 1 ».", files: ['src/game/chapters/potager.js'], see: ['pot-z01'] },
  { id: 'monde-ch2', t: '2 · La Forêt', s: 'encours', d: 'Première version complète : 12 zones, peintes, sonorisées ; retouches en cours', txt: "Brief de Raph (10 novembre 2026) : une forêt dense et mystérieuse en 12 zones, plus longue et plus riche que le Potager, sans ennemis pour l'instant. De la lisière ensoleillée à la lisière crépusculaire : fougères et racines géantes (saut mural), eaux miroirs (dash), piliers qui s'effondrent (sprint), ascension dans les pins, torrent et troncs flottants, canopée, souterrain bioluminescent, la statue oubliée, une tête de femme penchée vers le sol, le regard baissé dans l'ombre de ses arcades (un gros bloc de pierre ficelé d'une corde en croix ferme le tunnel ; on grimpe aux lianes de sa chevelure — leur départ caché dans le feuillage — jusqu'à sa tête, d'où seulement on attrape une liane qui mène à une grande branche, sortie d'un arbre agrippé au pilier ; au bout, une énorme poulie : on saisit la corde (↑, ou le bouton de saut sur téléphone), on la tire le long de la branche — KAGE peine, arc-bouté (animation rope_pull), lentement et par saccades, il souffle par moments, l'image tremble un peu sous l'effort, et chaque seconde de tirage lui coûte un quart de son énergie : à bout de souffle, il tient la corde sans pouvoir tirer et reprend haleine — et le saut la lâche ; tirée au-delà d'un grand rameau en Y feuillu, elle se coince dans sa fourche au retour (tendue du haut de la poulie jusqu'à la fourche) et le bloc reste levé d'une case : on passe en glissade ; lâchée trop tôt, le bloc retombe ; la corde, en chanvre clair torsadé, épaisse et cernée de sombre, ressort sur l'écorce et la pierre ; elle épouse la gorge de la poulie et la quitte au point de tangence, tendue en ligne droite jusqu'à l'épaule de KAGE ; le bloc, un monolithe de granit moucheté plus clair que le pilier, cerné de noir et biseauté, avec son ombre portée, est ceinturé d'une croix et d'une sangle qui débordent de ses arêtes, et deux brins des coins du haut jusqu'au nœud ; aucune racine ne passe devant lui ; elle clignote comme un coffre, des chevrons dorés montrent où tirer ; sauvegardé), lianes balancier (refaites le 13 novembre 2026 : courtes, nouées à de grosses branches qui sortent de grands fûts tous différents (branches de décor plus ou moins hautes, houppiers touffus, lierre), feuillues et fleuries ; balancier lent et naturel, l'élan ne vient qu'en poussant dans le sens du mouvement, portée réduite ; lianes souples dessinées en chaîne qui traîne et se débat ; un saut au bon moment, la liane qui remonte, envoie KAGE plus haut et plus loin ; brume qui dérive dans le ravin), descente devant un éboulis (refaite le 13 novembre 2026 : au sommet, un amas de gros blocs mal calés qu'il faut escalader : il tremble sous le poids de KAGE qui en redescend et s'effondre dès qu'il a remis pied à terre ; plus de fossés ni de tronc creux, des souches à sauter, une descente plus longue où courir en pente ne fatigue pas ; une masse de 150 pierres anguleuses, haute de près de 6 cases, qui roule les unes sur les autres, des volutes de poussière qui traînent derrière, des cailloux projetés ; de vraies pentes jouables entre les brèches, des arbres morts cassés, des rochers, des éboulis de cailloux). Plan complet : docs/FORET.md. Retouches de Raph (novembre 2026) : un grand pont suspendu moussu dans la canopée (planches qui ploient, oscillent, et dont certaines lâchent ; deux cordes de chaque côté), de l'eau au sol entre les lianes (chaque arbre de la canopée est posé à la main, les pieds sur la terre : les îlots suivent les arbres, et rien ne pousse au-dessus de l'eau ; les deux grandes eaux font 14 cases, plus que sprint + saut + dash ; les planches tombées ne reviennent pas ; planches de 18 px séparées de 6 px : on marche sur les jours, mais le trou d'une planche tombée (30 px) ne se passe qu'en sautant ; la grande branche de l'arbre du nid rompt sous KAGE et revient à la réapparition ; le coffre du nid est sur une branche à droite du tronc), une eau profonde dont on ne voit jamais le fond, une gorge peinte sous l'allée des piliers (falaise contrastée et végétalisée, sans trame), des galeries de terre sous une butte à souches dans l'ascension (zone 5 : un coffre, un fossé mortel, un avant-goût du souterrain), et le torrent (zone 6) plus long (quatre bras) aux rondins tous différents — 3 à 5 cases, 10 à 16 px de diamètre, ombrés en cylindre, écorce fendue, nœuds, moignons de branches cassées, un bout scié (ses cernes) et l'autre cassé, mousse par plaques —, des rochers pointus battus d'écume dans le lit, des embruns, des brindilles emportées (on ne s'y pose pas), la caverne aux perles (zone 8) refaite plus profonde et deux fois plus longue (racines de chêne, arbres à perles lumineuses, papillons, clairière au grand arbre et son oasis souterraine, sortie en bouche de caverne) ; sous terre, plus de « fonds de creux » peints case par case : ces carrés presque noirs ressortaient en rectangles dans le halo de KAGE (world.js, niche). Des détours pour l'aventure (12 novembre 2026, demande de Raph) : la cabane du guetteur dans un vieux chêne (zone 1), l'arbre aux cavités et ses creux dans l'écorce (zone 2 ; branches de plus en plus longues vers le haut, avec leurs exceptions — une grande branche basse de 15 cases qui rattrape toute chute, même en sprint ; un nœud creux traverse le tronc vers deux branches au-dessus de la racine géante ; branches effilées, rameaux et touffes : oldBough), l'arche de racines qui porte un arbre sacré et un petit sanctuaire au-dessus du sentier (zone 3 ; la motte repose sur six racines-piliers évasées au sol, qui s'affinent en montant et l'enserrent par les flancs), le belvédère au sommet du grand cèdre du couchant (zone 12) : chacun son coffre, et on en redescend toujours sans dégâts. 32 tests de faisabilité (tests/foret.cjs, dans npm test) : chaque passage se franchit et la mécanique voulue est nécessaire (sans dash, on tombe à l'eau ou on manque la corniche ; sans sprint, le pont emporte KAGE ; immobile, l'éboulis le rattrape). On y entre en passant la porte du temple : fondu au noir, la carte « Fin de l'initiation — Chapitre 2 — La Forêt — Le voyage commence », puis la carte s'efface sur la lisière ; la partie continue (ryō, skins, corbeau vaincu suivent KAGE ; « Continuer » reprend dans le bon chapitre). On l'aperçoit déjà par la porte du temple, à la fin du Potager.", files: ['docs/FORET.md', 'docs/MONDE.md', 'src/game/chapters/foret.js', 'src/game/foret/mechanics.js', 'src/game/foret/index.js', 'src/game/foret/backdrop.js', 'src/game/foret/world.js', 'src/game/foret/props.js', 'src/game/foret/live.js', 'src/game/foret/avalanche.js', 'assets/music/foret.mp3', 'tests/foret.cjs', 'tests/foret_pilotes.js', 'src/game/foret/palette.js', 'src/game/foret/layers.js', 'src/game/foret/statue.js', 'tools/foret_planche.mjs', 'src/game/potager/temple.js'], links: [['Les 12 zones peintes', 'docs/foret/apercu_zones.png'], ['Les détours', 'docs/foret/detours.png'], ['La carte du chapitre', 'docs/foret/carte_chapitre.png'], ['Planche d\'ambiance', 'docs/foret/planche_ambiance.png'], ['Planche de la statue', 'docs/foret/planche_statue.png'], ['KAGE sur une liane', 'docs/foret/planche_kage_liane.png']], see: ['pot-porte'] },
  { id: 'monde-ch3', t: '3 · La forêt des grands arbres', s: 'afaire', d: 'Troncs immenses, brume', txt: "Ennemi pressenti : Kage-mane. Marchand dans une clairière.", see: ['ennemi-kagemane'] },
  { id: 'monde-ch4', t: '4 · Le village des basses montagnes', s: 'afaire', d: 'Toits, lanternes, marché', txt: "Ennemi pressenti : Chōchin. Marchand au marché.", see: ['ennemi-chochin'] },
  { id: 'monde-ch5', t: '5 · Les hautes montagnes', s: 'afaire', d: 'Vent, neige, glace, ascension', txt: "Ennemi pressenti : un corbeau messager. Marchand dans un refuge.", see: ['ennemi-messager'] },
  { id: 'monde-ch6', t: '6 · Le temple de pierre', s: 'afaire', d: 'Pierre, mousse, or terni', txt: "Mini-boss pressenti : Ishi. Marchand devant le temple.", see: ['ennemi-ishi'] },
  { id: 'monde-ch7', t: '7 · Le dojo final', s: 'afaire', d: 'L\'épreuve ultime', txt: "Tous les ennemis, combinés. On le voit déjà au flanc du Mont Kagero, au fond du Potager : un sanctuaire sur deux terrasses de grands murs de pierre en gradins, une grande salle au double toit, une pagode à cinq étages coiffée d'or, de la neige sur les toits, un escalier en lacets et son torii (paintDojo, backdrop.js).", links: [['Le dojo au loin', 'docs/potager/dojo_final.png']], see: ['decor-backdrop'] },
  { id: 'monde-histoire', t: 'Le fil des talismans', s: 'idee', d: 'Histoire en fond, à confirmer',
    txt: "Proposition : quelqu'un pose des talismans maudits qui réveillent gardiens, mannequins et objets du pays ; KAGE remonte la piste jusqu'au dojo. Pas de longs dialogues : l'histoire se lit dans le décor. Question encore ouverte.", see: ['proj-questions'] },
  { id: 'monde-niveau1', t: 'Niveau 1 (ancien)', s: 'fait', d: 'Adresse #niveau-1',
    txt: "170×22 carreaux qui demandent toutes les mécaniques : tunnel bas, fossés de 5 et 8, puits à sauts muraux, gong au shuriken, arène, pics, torii d'arrivée ; 5 WARA, plusieurs TATE, 3 lanternes, chronomètre et écran de fin.",
    files: ['src/game/maps.js', 'src/game/level.js'] },
  { id: 'monde-terrain', t: 'Terrain d\'essai', s: 'fait', d: 'Adresse #terrain',
    txt: "Long sol plat, un puits et un mur isolé pour le saut mural, un TATE et un WARA. Sert à essayer les mouvements.", files: ['src/game/maps.js'] },
  { id: 'monde-carte', t: 'Carte du monde', s: 'fait', d: 'Schéma des 7 chapitres',
    txt: "Carte schématique dessinée par un script Python.", files: ['tools/monde_carte.py'], links: [['Voir la carte', 'docs/monde/carte_du_monde.png']] },
]},
{ id: 'potager', side: 'R', t: 'Chapitre 1 · Le Potager', sub: '9 zones, 548 × 22 cases', color: 'potager', leaves: [
  { id: 'pot-z01', t: '01 · Le chemin des premières pousses', s: 'fait', d: 'Avancer, sauter, sprinter',
    txt: "Le début du voyage : un long chemin plat dans le hameau (fermes, puits, cerisier, champs), puis la ferme au toit de chaume, l'épouvantail au grand chapeau, les rangs de carottes. Les premières aides apparaissent une par une.",
    files: ['src/game/chapters/potager.js#L25'], see: ['hab-epouvantail', 'sys-aides'] },
  { id: 'pot-z02', t: '02 · Les cultures en terrasse', s: 'fait', d: 'Le premier dash, la cache de la cascade',
    txt: "Premier trou à franchir au dash. Au loin, la colline en terrasses d'où descend la grande cascade, et une cache de ryō derrière elle. Une ferme au pied de l'escalier de pierre.",
    files: ['src/game/chapters/potager.js#L80'], see: ['decor-colline'] },
  { id: 'pot-z03', t: '03 · Les canaux d\'irrigation', s: 'fait', d: 'Saut, dash, sprint ; pilotis ; la grue',
    txt: "Canaux, berges de pierre, moulin et roue à eau, tonneaux, kappa pêcheur. Allongée : un jardin sur pilotis au-dessus d'un grand canal (plateformes légères cultivées sur plusieurs niveaux, échelles, chaumière au bord de l'eau), puis l'énigme de la grue de bambou.",
    files: ['src/game/chapters/potager.js#L121'], see: ['hab-kappa'] },
  { id: 'pot-z04', t: '04 · Le vieux verger', s: 'fait', d: 'Premiers WARA, coup de pied',
    txt: "Arbres fruitiers tortueux de tailles variées, plantés au sol (la voûte de branches, qui flottait sur les écrans hauts, a été retirée), grosse branche praticable dans un grand cerisier. Premiers ennemis et apprentissage du coup de pied.",
    files: ['src/game/chapters/potager.js#L223'], see: ['ennemi-wara', 'ennemi-nuisible'] },
  { id: 'pot-z05', t: '05 · La serre de bambou', s: 'fait', d: 'Dash, glissade, sortie par la charpente',
    txt: "Une grande serre (13 cases de haut) : voûte en arceaux, toiles déchirées, hautes étagères à bocaux, établi, semis, plantes suspendues, gourdes, rais de lumière. Dedans : un feuillage bas de bambous (dash), des étagères de pots, une étagère renversée (glissade). La sortie est bouchée par des bambous très serrés : on se glisse dans un puits, on y monte en sauts muraux, on traverse la poutre de charpente par-dessous (5 ryō le long de la poutre) et on sort par le haut ; 7 ryō de plus sur le faîtage, pour qui ose monter sur le toit. Le toit est une toile en pointes, façon chapiteau, tendue par de fines perches de bambou (avec leurs fanions délavés), comme dans la première version. Dehors, un bosquet : feuillage bas puis mur de bambous (sauts muraux).",
    files: ['src/game/chapters/potager.js#L278'], links: [['GIF : sortie par la charpente', 'docs/potager/serre_charpente.gif'], ['Toit de toile', 'docs/potager/serre_toit_toile.png']] },
  { id: 'pot-z06', t: '06 · La grange abandonnée', s: 'fait', d: 'Caisses à briser au sabre',
    txt: "Grand toit de chaume, mur de planches, outils suspendus, pénombre et halos de lanternes. Trois niveaux : sol, mezzanine, grenier. On monte sur la mezzanine par un petit escalier de bottes de foin incassables (2 cases, puis 1), entre les deux premières plateformes : avant, une caisse seule, qu'on brisait au lieu de monter dessus (et qui était trop basse). Trois ryō sur la poutre du milieu (la plateforme de droite). Les poteaux d'angle passent sous le chaume (le toit les recouvre).",
    files: ['src/game/chapters/potager.js#L344'], links: [['Marches de foin', 'docs/potager/grange_marches_foin.png']], see: ['pot-grenier', 'sys-caisses'] },
  { id: 'pot-grenier', t: 'Le grenier de la grange', s: 'fait', d: '3e étage, 5 ryō, une caisse et un coffre',
    txt: "On monte de la mezzanine par des bottes de foin jusqu'au plancher du grenier. Pignon en planches, chevrons, lucarne, kakis séchés, chouette. Le vieux coffre (nagamochi) s'ouvre avec ↑ / E (ou le bouton) : le couvercle bascule et 10 ryō jaillissent en gerbe, puis retombent devant lui ; coffre ouvert sauvegardé (chests). Un plafond invisible suit la pente du toit. Le toit reste plein de loin et s'efface quand KAGE monte.",
    files: ['src/game/potager/props.js', 'src/game/potager/live.js'], links: [['Planche du grenier', 'docs/potager/grenier_grange.png']], see: ['hab-chouette', 'proj-pr19'] },
  { id: 'pot-z07', t: '07 · Le jardin des sentinelles', s: 'fait', d: 'Bassin, pont rouge, TATE, grande porte',
    txt: "Bassin aux carpes, pont rouge rompu, sanctuaire, renards de pierre, la maison du gardien, un TATE et la grande porte en bois. Le bosquet des sentinelles : un feuillage bas (dash), puis deux bouquets de bambous serrés plantés en travers du chemin, qu'on franchit en sauts muraux.",
    files: ['src/game/chapters/potager.js#L404'], see: ['ennemi-tate', 'hab-koi'] },
  { id: 'pot-z08', t: '08 · Le comptoir du voyageur', s: 'fait', d: 'Le marchand, puis la route des collines',
    txt: "Échoppe à l'ombrelle rouge et à l'auvent indigo, poteau indicateur, puis une pépinière en étages (plateformes sur pilotis cultivées, échelles) et la route vers les collines, jusqu'au champ du corbeau.",
    files: ['src/game/chapters/potager.js#L455'], see: ['hab-marchand', 'pot-z09'] },
  { id: 'pot-z09', t: '09 · Le champ du corbeau', s: 'fait', d: 'Le mini-boss, puis la porte du temple',
    txt: "Arène de 66 cases : lanterne à l'entrée, rangs de navets, choux, radis, carottes, poireaux, arbres fruitiers, treillis, deux tas de pierres (où le corbeau se sert), quatre plateformes de bois fragiles sur pilotis (deux hauteurs, échelles, pots), et l'épouvantail géant où trône KARASU-KASHI. Au bout, la grande porte du temple (voir sa boîte) reste fermée tant qu'il n'est pas vaincu ; le monde s'arrête derrière elle.",
    files: ['src/game/chapters/potager.js#L485', 'src/game/potager/props.js', 'src/game/potager/live.js'], links: [['Porte ouverte', 'docs/enemies/karasu_porte_ouverte.png']], see: ['ennemi-karasu', 'pot-porte'] },
  { id: 'pot-porte', t: 'La porte du temple', s: 'fait', d: 'La fin du chapitre, au bout du monde',
    txt: "Un pavillon de porte (rōmon) peint en vraie perspective (temple.js : chaque point est projeté par une petite caméra) : vu de trois quarts, sa façade tournée vers KAGE, piliers vermillon, enduit et fenêtres à barreaux, consoles dorées, grand toit de tuiles aux coins relevés, plaque du nom. Son panneau droit touche le bord du monde : rien ne se voit derrière. Fermée, une corde sacrée et un talisman la scellent ; à la défaite du corbeau, le talisman se déchire et les deux vantaux pivotent lentement vers KAGE (4,2 s, aux deux tiers : ils cachent encore une part du passage). Elle ne s'ouvre que lorsque KAGE la voit (après la défaite du corbeau, ou à la reprise d'une partie, elle attend d'entrer dans l'image) : le joueur la voit toujours s'ouvrir devant lui. Le joueur garde la main : KAGE continue de marcher, passe derrière le vantail et le mur du pavillon (la porte le dessine entre le couloir et la façade) et disparaît ; aussitôt après, la fin du chapitre. Au fond d'un couloir sombre, une scène peinte : un coin de la forêt dense et mystérieuse du chapitre 2 (choix de Raph, d'après son image de référence : brume bleu-vert, troncs droits à perte de vue, sapins étagés, grands troncs moussus à l'écorce rousse, rais de lumière, fougères, sentier et une lueur au fond). Les autres scènes restent à l'essai avec ?porte=bambous|escalier|torii|brume.",
    keys: ['Façade tournée de 28°, perspective à 260 px', 'Ouverture : 4,2 s, 62°, on passe aux 3/5', 'Intérieur : la forêt du chapitre 2'],
    files: ['src/game/potager/temple.js', 'src/game/potager/live.js', 'src/game/level.js', 'src/game/chapters/potager.js#L604'],
    links: [['GIF : la porte s\'ouvre', 'docs/potager/porte_temple.gif'], ['GIF : ancienne entrée (retirée)', 'docs/potager/porte_entree.gif'], ['Fermée, s\'ouvre, ouverte', 'docs/potager/porte_temple.png'], ['La forêt par la porte', 'docs/potager/porte_foret.png'], ['Les autres intérieurs essayés', 'docs/potager/porte_interieurs.png']], see: ['pot-z09', 'ennemi-karasu', 'monde-ch2'] },
  { id: 'pot-grue', t: 'La grue de bambou', s: 'fait', d: 'Énigme : dash, sauts muraux, shuriken',
    txt: "Au bout des canaux, un mur de blocs de pierre ficelés en croix pend à une grue de bambou et bouche le passage ; une fosse l'attend dessous. Le mât de la grue, juste après la fosse, est une tour de bambou au treillis serré : on ne passe pas par-dessus les blocs (l'ancien surplomb rocheux, qui semblait flotter, a disparu) ; en bas, on passe entre ses montants. On se glisse au dash sous un premier mur de bambous, on monte en sauts muraux jusqu'à la plateforme de la grue ; la grue est loin, à 12 cases de vide (ni le sabre, ni un saut, ni un dash n'y mènent), et seul un shuriken lancé du bout de la plateforme coupe la corde ; un escalier de bois de cinq marches, vu de trois quarts (deux limons en biais, des marches clouées de l'un à l'autre, sans contremarche, une main courante de corde de chaque côté), ramène du sol à la plateforme (pour qui a sauté trop tôt) : les blocs tombent et comblent la fosse à ras du sol. Depuis le sol, la corde est hors de portée. Grue coupée sauvegardée (cranes).",
    files: ['src/game/chapters/potager.js', 'src/game/level.js', 'src/game/potager/live.js', 'src/game/potager/props.js'], links: [['GIF : la grue', 'docs/potager/grue_bambou.gif'], ['Le mât en tour', 'docs/potager/grue_mat.png'], ['L\'escalier de retour', 'docs/potager/grue_escalier.png']], see: ['pot-z03', 'kage-shuriken'] },
  { id: 'pot-pilotis', t: 'Plateformes sur pilotis', s: 'fait', d: 'Cultivées, à plusieurs niveaux, échelles',
    txt: "Des plateformes de bois légères (« - », traversables par-dessous) : le jardin sur pilotis des canaux, les plateformes de cueillette du verger, la pépinière en étages du comptoir du voyageur, comme la plateforme de récolte près de la rizière. Cultures et pots dessus, échelles entre les niveaux, ryō en haut. Les poteaux montent jusque sous les planches (elles ne font que 6 px d'épaisseur), avec leurs jambes de force. Les échelles partent du bout de la plateforme du dessous et s'accrochent au début de celle du dessus (Builder.ladder).",
    files: ['src/game/chapters/potager.js', 'src/game/potager/tiles.js', 'src/game/potager/props.js'], links: [['Poteaux sous les planches', 'docs/potager/pilotis_poteaux.png'], ['Échelles', 'docs/potager/echelles_pepiniere.png']], see: ['pot-z03', 'pot-z04', 'pot-z08'] },
  { id: 'pot-reste', t: 'Ce qui reste du script', s: 'afaire', d: 'Planches, ambiance, lumière',
    txt: "Le script détaillé du chapitre fourni par Raph demande encore : les planches du marchand et du petit nuisible, des sons d'ambiance et de la musique par zone, un éclairage plus marqué dans la grange.",
    files: ['docs/REPRISE.md'], see: ['proj-suite', 'son-ambiance'] },
]},

{ id: 'decor', side: 'L', t: 'Décor et image', sub: 'tout est peint en code', color: 'decor', leaves: [
  { id: 'decor-cadrage', t: 'Cadrage 448 × 252', s: 'fait', d: 'Pixels nets, échelle entière',
    txt: "Résolution interne de 448×252 (dézoom demandé, puis très léger rezoom pour que KAGE ne paraisse pas trop petit). Mise à l'échelle entière uniquement, sans lissage. Le sol est à 86 % de la hauteur de l'image.",
    files: ['src/main.js'] },
  { id: 'decor-camera', t: 'Caméra à paliers', s: 'fait', d: 'Stable avant tout',
    txt: "En largeur, zone morte (KAGE va de 30 % à 56 % de l'écran) puis rattrapage amorti. En hauteur, des paliers : seul un changement de sol de plus de 3,5 cases déclenche un recadrage franc d'environ 0,6 s. Ne jamais réintroduire de suivi vertical continu. Vers le bas, elle ne suit KAGE que s'il descend vers un vrai sol : s'il tombe dans l'eau, un ravin ou d'un pont qui s'effondre, l'image reste figée et il sort par le bas (demande de Raph : on ne voit jamais sous le sol). Une zone peut imposer son cadrage (camGround : la statue).",

  { id: 'decor-calque', t: 'Paysage sur son calque', s: 'fait', d: 'Les montagnes glissent au pixel d\'écran',

    files: ['src/main.js', 'src/style.css'] },
  { id: 'decor-backdrop', t: 'Fond en parallaxe', s: 'fait', d: 'Du Mont Kagero au premier plan',

    files: ['src/game/potager/backdrop.js', 'src/game/sky.js'], see: ['monde-ch7', 'decor-ciel'] },
  { id: 'decor-ciel', t: 'Ciel et heures du jour', s: 'fait', d: 'Soleil levant, couchant, nuages, étoiles',
    txt: "Module commun src/game/sky.js : nuages fins (ventre plat ombré, dessus en dômes éclairés en haut à gauche, bouts effilochés), cirrus, soleil et son halo en anneaux tramés, étoiles. Dans la Forêt (SKIES dans foret/backdrop.js), chaque heure a son ciel : soleil levant derrière les troncs au matin avec des nuages roses, plein ciel bleu à la canopée, sous-bois turquoise, sanctuaire sombre, soleil couchant orange qui traverse la forêt, crépuscule violet et étoiles. La lumière du soleil déborde en halo léger sur la forêt lointaine. La grande chaîne du chapitre 1 (Mont Kagero, le dojo) reste visible au loin, repeinte un quart plus grande (on a avancé vers elle : paintFar(…, 1,25) ; RANGE dans foret/backdrop.js), teintée par la lumière de l'heure.", files: ['src/game/sky.js', 'src/game/foret/backdrop.js'], see: ['decor-backdrop', 'monde-ch2'] },
  { id: 'decor-tuiles', t: 'Terrain et tuiles', s: 'fait', d: 'Terre à mottes, murets de pierre sèche',
    txt: "Terre meuble mêlée de grosses mottes, flancs légèrement ondulés, tapis d'herbe épais. Murets de pierre sèche moussus avec une limite naturelle vers la terre. Aussi : pierre taillée, racines, poutres, passerelles fines sur pilotis (« - »), poutres de charpente en bambou, bambous serrés (posés au sol : un mur ; suspendus : une masse de feuillage portée par ses tiges), surplomb rocheux, berges et eau. Le terrain est peint par tranches de 512 px à la demande.",
    files: ['src/game/potager/tiles.js', 'src/game/potager/world.js'],
    links: [['Sol de terre', 'docs/potager/sol_terre.png'], ['Murets', 'docs/potager/sol_pierres.png'], ['Transition', 'docs/potager/sol_transition.png']] },
  { id: 'decor-props', t: 'Une cinquantaine de décors', s: 'fait', d: 'Ferme, Jizō, puits, pont rouge…',
    txt: "Ferme, Jizō, épouvantails, légumes, clôture de bambou, puits, charrette, moulin, lanternes de pierre, arbres fruitiers, serre, grange, sanctuaire, renards de pierre, pont rouge rompu, grande porte, échoppe du marchand… plus des décors automatiques (buissons, fougères, fleurs).",
    files: ['src/game/potager/props.js', 'src/game/chapters/potager.js'], links: [['Planche des 8 premières zones', 'docs/potager/potager_zones.png']] },
  { id: 'decor-colline', t: 'Colline en terrasses', s: 'fait', d: 'Gradins de rizières, en volume',
    txt: "Colline au loin, construite gradin par gradin (largeurs irrégulières), avec un ruisseau qui naît au sommet et la grande cascade qui passe derrière les plateformes. Raph y est très attentif : pas d'effet « feuille de papier ». Les gradins alternent rizière inondée, riz mûr, potager et théiers, chacun en volume.",
    files: ['src/game/potager/props.js', 'src/game/potager/live.js'],
    links: [['Colline', 'docs/potager/colline_terrasses.png'], ['Colline dans le fossé', 'docs/potager/colline_fosse.png'], ['Rizières avant / après', 'docs/potager/colline_rizieres.png']], see: ['proj-pr19', 'pot-z02'] },
  { id: 'decor-live', t: 'Ce qui bouge', s: 'fait', d: 'Eau, pluie, fumées, lumière…',
    txt: "Roue à eau, cascade et écume, reflets et nénuphars, poissons, tonneaux, kappa, koïs, fumées, pluie de la serre, rais de lumière, pénombre de la grange, clochette de l'échoppe, papillons, pétales, poussières dorées. Aussi : le coffre du grenier, la grue de bambou (corde, chute des blocs) et les plateformes fragiles de l'arène (effondrement).",
    files: ['src/game/potager/live.js'], see: ['hab-faune'] },
  { id: 'decor-palette', t: 'Palette et pinceaux', s: 'fait', d: 'Bruit, tramage, couleurs',

    files: ['src/game/potager/palette.js', 'src/game/potager/paint.js', 'src/game/potager/index.js'] },
]},
{ id: 'son', side: 'L', t: 'Son et musique', sub: 'bruitages synthétisés, une musique par chapitre', color: 'son', leaves: [
  { id: 'son-sfx', t: 'Bruitages synthétisés', s: 'fait', d: 'Web Audio ; les seuls fichiers : le corbeau',

  { id: 'son-musique', t: 'Musique du Potager', s: 'fait', d: 'Intro de 25 s puis boucle de 90 s',
    txt: "Tirée d'une vidéo fournie par Raph : 64 BPM, introduction jouée une fois, boucle sans couture (fondu d'un temps). Démarre au premier geste avec un fondu, baisse dans la boutique, s'éteint à la fin. Remontée deux fois de 3 dB à la demande de Raph. Droits : Raph doit pouvoir utiliser ce morceau.",
    keys: ['MUSIC.volume 0,0567 (+5 dB en novembre 2026)', 'Repères loopStart 25,09 s, loopEnd 115,089 s', '−16 LUFS, MP3 160 kb/s'],
    files: ['assets/music/potager.mp3', 'src/engine/music.js'], links: [['Planche', 'docs/sons/musique_potager.png']], see: ['proj-pr19'] },
  { id: 'son-boss', t: 'Musique et sons du corbeau', s: 'fait', d: 'Fournis par Raph : ailes, croassements, combat',
    txt: "Trois enregistrements fournis par Raph (novembre 2026). Musique du combat (125 BPM) : un peu avant le champ du corbeau (4 cases avant la zone 9), la musique du chapitre descend en 2,5 s et celle du combat monte en 3,5 s ; elle reste en fond (4,4 dB sous celle du chapitre) ; introduction de 7 s puis boucle de 66 s dont la fin se fond dans le début sur deux mesures ; à sa défaite, retour en fondu à la musique du chapitre. Coups d'ailes (trois variantes, hauteur légèrement variée, volume baissé à la demande de Raph) : un à chaque descente d'aile (images fly_3, carry_3, open_2, takeoff_2) ; battement ralenti (0,56 s), environ 1,8 coup par seconde. Croassements : trois cris dès que KAGE entre dans l'arène (le corbeau reste sur son perchoir 3,8 s avant d'aller chercher sa première pierre), deux à chaque retour au perchoir ; le bec s'ouvre au rythme des cris (cawOpen / cawShut).",
    keys: ['bossMusic : loopStart 7,27 s, loopEnd 73,51 s, gain 0,6', 'Music.switchTo : fondu enchaîné entre pistes', 'Échantillons : assets/sfx/, tools/sons_karasu.py'],
    files: ['assets/music/karasu.mp3', 'assets/sfx/', 'src/engine/music.js', 'src/engine/sfx.js', 'src/game/karasu.js', 'tools/sons_karasu.py'], see: ['ennemi-karasu', 'son-musique'] },
  { id: 'son-outil', t: 'Préparer une musique', s: 'fait', d: 'tools/musique_boucle.py',
    txt: "« chercher » propose tempo et points de boucle ; « monter » égalise, fond la boucle (un temps, ou --fondu secondes), règle le volume et sort le MP3. Ne jamais réencoder à la main : refaire depuis la source avec le script.",

  { id: 'son-banc', t: 'Banc d\'écoute', s: 'fait', d: 'Avant / après, page privée',

  { id: 'son-ambiance', t: 'Sons d\'ambiance', s: 'encours', d: 'La Forêt : faite ; le Potager : à faire',
    txt: "La Forêt a son ambiance synthétisée, en stéréo et très discrète (ambience() dans sfx.js, mélange FOREST_AMB dans main.js) : vent en rafales à gauche et à droite, oiseaux, gouttes sur la pierre, craquements de bois, grillons au crépuscule, torrent dans la zone 6, grondement de caverne sous terre ; le mélange suit la lumière de la zone. Prévu aussi pour le Potager : oiseaux, eau, moulin, pluie dans la serre, grange feutrée, clochettes.", files: ['src/engine/sfx.js', 'src/main.js'], see: ['pot-reste', 'monde-ch2'] },
  { id: 'son-foret', t: 'Musique et bruitages de la Forêt', s: 'fait', d: 'Intro de 12 s puis boucle de 140 s ; 18 bruitages',

{ id: 'systemes', side: 'L', t: 'Règles et systèmes', sub: 'sauvegarde, ryō, boutique, progression', color: 'systemes', leaves: [
  { id: 'sys-titre', t: 'Écran titre', s: 'fait', d: 'Nouvelle partie ou Continuer',

  { id: 'sys-intro', t: 'Introduction', s: 'encours', d: 'L\'encre, la lune, le coup de pied',
    txt: "Demande de Raph (novembre 2026), combinaison des ouvertures 1 et 4 de la planche : le noir ; « THE NINJA GAME » s'écrit lettre à lettre au pied des montagnes, puis un coup de pinceau se tire dessous (large à la base, effilé et sec à la fin, de légères éclaboussures) ; la lune se lève au-dessus d'un col de la grande chaîne du Potager (peinte par le vrai code du décor, recolorée en nuit), éclaircit le ciel et fait sortir les montagnes du noir ; leur pied se fond par paliers dans une base d'encre neutre qui fonce vers le bas ; KAGE arrive en ombre chinoise en coup de pied sauté (tobi yoko geri, pose dessinée exprès d'après les références de Raph : buste en arrière, jambe tendue talon en avant, l'autre repliée, garde levée, poing arrière à la hanche) et se fige au centre de la lune. Le menu apparaît alors, en ligne (Continuer à gauche, Nouvelle partie à droite). Musique (novembre 2026, tirée d'une vidéo de Raph, tools/musique_boucle.py entier → assets/music/intro.mp3) : comme les navigateurs ne jouent aucun son avant un geste, l'intro attend d'abord sur le noir « Appuie sur une touche » ; ce geste lance l'image et la musique ensemble, l'horloge de l'intro devient celle de la musique, et sa première vraie note tombe à l'instant où KAGE se fige (le titre et les montagnes ont fini d'apparaître pendant le long son). La musique finie (≈ 1 min), fondu au noir et volume à zéro, puis tout recommence, en boucle. Tant que la musique n'est pas partie (un navigateur peut refuser le son au premier geste, surtout sur téléphone), chaque geste retente de la lancer, à l'endroit voulu. Dans la version de test, le panneau passe au-dessus de l'intro et montre un témoin du son (« Son : en marche · Intro : musique »). Une touche ou un toucher l'amène à sa fin. Dans la version de test, elle se joue au lancement (pas en changeant de chapitre) et le bouton « Intro » du panneau la rejoue. Les tests la passent (__KAGE_SKIP_INTRO) sauf un, qui la joue jusqu'au bout. Le coup de pied sauté est devenu une animation du jeu (air_kick).",

// ===========================================================================
// Mise en page et interactions
// ===========================================================================
const REPO = 'https://github.com/Raphgh31/ninja-video-game/blob/main/';
const STATES = {
  fait: 'Fait', encours: 'En cours', provisoire: 'Provisoire', afaire: 'À faire', idee: 'Idée',
};
const $ = (s, el = document) => el.querySelector(s);
const world = $('#world'), map = $('#map'), svg = $('#links'), panel = $('#panel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const LEAF_W = 196, LEAF_H = 58, GAP_X = 10, GAP_Y = 10, HUB_W = 168, HUB_X = 300, LEAF_X = 520, BRANCH_GAP = 46;
const byId = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// --- centre ---
const center = document.createElement('button');
center.type = 'button';
center.className = 'node center';
center.innerHTML = `<img alt="KAGE" src="${SPRITES.kage[0]}"><b>KAGE</b><span>jeu de plateforme ninja · ${BRANCHES.reduce((n, b) => n + b.leaves.length, 0)} éléments</span>`;
world.appendChild(center);
const CW = 210, CH = 95;
center.style.left = -CW / 2 + 'px'; center.style.top = -CH / 2 + 'px';
if (!reduce) { let f = 0; const img = $('img', center); setInterval(() => { f = (f + 1) % 4; img.src = SPRITES.kage[f]; }, 170); }

// --- branches : on crée les boîtes, on mesure leur hauteur, puis on les range ---
function path(d, color, cls) {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d); p.setAttribute('stroke', color);
  if (cls) p.setAttribute('class', cls);
  svg.appendChild(p); return p;
}
BRANCHES.forEach(b => {
  const col = `var(--c-${b.color})`;
  b.el = document.createElement('button');
  b.el.type = 'button'; b.el.className = 'node hub';
  b.el.style.setProperty('--c', col);
  b.el.innerHTML = `${esc(b.t)}<small>${esc(b.sub)}</small>`;
  b.el.addEventListener('click', () => focusBranch(b));
  world.appendChild(b.el);
  b.leaves.forEach(l => {
    l.branch = b; byId[l.id] = l;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'node leaf'; el.id = 'n-' + l.id;
    el.style.setProperty('--c', col);
    const spr = l.spr && sprite(l.spr);
    el.innerHTML = `<span class="t">${esc(l.t)}</span>${spr ? `<img class="spr" alt="" src="${spr}">` : `<span class="st" data-s="${l.s}" title="${STATES[l.s]}"></span>`}<span class="d">${esc(l.d)}</span>`;
    if (spr) el.setAttribute('aria-label', `${l.t}, ${STATES[l.s]}`);
    el.addEventListener('click', () => open(l));
    world.appendChild(el);
    l.el = el;
  });
});
function layout() {
  svg.replaceChildren();
  BRANCHES.forEach(b => b.leaves.forEach(l => { l.el.style.height = ''; }));
  ['R', 'L'].forEach(side => {
    const list = BRANCHES.filter(b => b.side === side);
    list.forEach(b => {
      b.cols = b.leaves.length > 3 ? 2 : 1;
      b.rowH = [];
      b.leaves.forEach((l, i) => { const r = Math.floor(i / b.cols); b.rowH[r] = Math.max(b.rowH[r] || 0, l.el.offsetHeight); });
      b.h = b.rowH.reduce((n, h) => n + h, 0) + GAP_Y * (b.rowH.length - 1);
    });
    const total = list.reduce((n, b) => n + b.h, 0) + BRANCH_GAP * (list.length - 1);
    let y = -total / 2;
    list.forEach(b => { b.y0 = y; b.cy = y + b.h / 2; y += b.h + BRANCH_GAP; });
  });
  BRANCHES.forEach(b => {
    const dir = b.side === 'R' ? 1 : -1, col = `var(--c-${b.color})`;
    const hubH = b.el.offsetHeight;
    b.el.style.left = (dir > 0 ? HUB_X : -HUB_X - HUB_W) + 'px';
    b.el.style.top = (b.cy - hubH / 2) + 'px';
    const sx = dir * CW / 2, ex = dir > 0 ? HUB_X : -HUB_X, mx = (sx + ex) / 2;
    b.trunk = path(`M${sx} 0 C${mx} 0 ${mx} ${b.cy} ${ex} ${b.cy}`, col, 'trunk');
    const hubOut = dir > 0 ? HUB_X + HUB_W : -HUB_X - HUB_W;
    const inner = dir > 0 ? LEAF_X : -LEAF_X, m2 = (hubOut + inner) / 2;
    let ry = b.y0;
    b.rowH.forEach((h, r) => {
      // une brindille par rangée, jusqu'à la boîte intérieure ; la boîte extérieure lui fait suite
      const ty = ry + h / 2;
      const tw = path(`M${hubOut} ${b.cy} C${m2} ${b.cy} ${m2} ${ty} ${inner} ${ty}`, col);
      tw.setAttribute('stroke-opacity', '.55');
      b.leaves.slice(r * b.cols, r * b.cols + b.cols).forEach((l, c) => {
        l.x = dir > 0 ? LEAF_X + c * (LEAF_W + GAP_X) : -LEAF_X - LEAF_W - c * (LEAF_W + GAP_X);
        l.y = ry; l.h = h; l.twig = tw;
        l.el.style.left = l.x + 'px'; l.el.style.top = l.y + 'px'; l.el.style.height = h + 'px';
      });
      ry += h + GAP_Y;
    });
  });
}
layout();
function sprite(k) { return k === 'kage0' ? SPRITES.kage[0] : SPRITES[k]; }

// --- vue : déplacement et zoom ---
const view = { x: 0, y: 0, k: 1 };
function apply(ease) {
  world.classList.toggle('ease', !!ease && !reduce);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}
const clampK = k => Math.min(2.4, Math.max(0.18, k));
function zoomAt(px, py, f, ease) {
  const k = clampK(view.k * f); f = k / view.k;
  view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.k = k; apply(ease);
}
function bounds() {
  const B = { x0: -CW / 2, x1: CW / 2, y0: -CH / 2, y1: CH / 2 };
  BRANCHES.forEach(b => b.leaves.forEach(l => { B.x0 = Math.min(B.x0, l.x); B.x1 = Math.max(B.x1, l.x + LEAF_W); B.y0 = Math.min(B.y0, l.y); B.y1 = Math.max(B.y1, l.y + l.h); }));
  return B;
}
function fitTo(B, ease, maxK = 1.2) {
  const W = innerWidth, H = innerHeight;
  const top = $('.top').getBoundingClientRect().bottom + 12, bottom = 70;
  const avW = W - 32 - (panel.hidden || W <= 640 ? 0 : 400), avH = H - top - bottom - (!panel.hidden && W <= 640 ? H * .62 : 0);
  const k = clampK(Math.min(avW / (B.x1 - B.x0), avH / (B.y1 - B.y0), maxK));
  view.k = k;
  view.x = 16 + avW / 2 - (B.x0 + B.x1) / 2 * k;
  view.y = top + avH / 2 - (B.y0 + B.y1) / 2 * k;
  apply(ease);
}
function fitAll(ease) { fitTo(bounds(), ease); }
function focusBranch(b) {
  const xs = b.leaves.map(l => l.x), ys = b.leaves.map(l => l.y);
  const hx = b.side === 'R' ? HUB_X : -HUB_X - HUB_W;
  fitTo({ x0: Math.min(hx, ...xs) - 10, x1: Math.max(hx + HUB_W, ...xs.map(x => x + LEAF_W)) + 10, y0: Math.min(...ys) - 10, y1: Math.max(...b.leaves.map(l => l.y + l.h)) + 10 }, true, 1.6);
}
function reveal(l) {
  const W = innerWidth, H = innerHeight, narrow = W <= 640;
  const r = l.el.getBoundingClientRect();
  const maxX = narrow ? W : W - 400, maxY = narrow ? H * .38 : H;
  const topY = $('.top').getBoundingClientRect().bottom;
  if (view.k < .75) { // trop petit pour lire : on rapproche
    const k = 1; const cx = l.x + LEAF_W / 2, cy = l.y + l.h / 2;
    view.k = k; view.x = maxX / 2 - cx * k; view.y = (topY + maxY) / 2 - cy * k; apply(true); return;
  }
  if (r.left < 8 || r.right > maxX - 8 || r.top < topY + 4 || r.bottom > maxY - 8) {
    view.x += (maxX / 2) - (r.left + r.right) / 2; view.y += (topY + maxY) / 2 - (r.top + r.bottom) / 2; apply(true);
  }
}

// glisser, molette, pincer
const pts = new Map(); let drag = null, moved = false, pinch = null;
map.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; drag = null; moved = true; }
});
addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.k * d / pinch.d) / view.k);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) > 5) { moved = true; map.classList.add('dragging'); }
    if (moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; apply(); }
  }
});
function up(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (pts.size === 0) { drag = null; map.classList.remove('dragging'); }
}
addEventListener('pointerup', up); addEventListener('pointercancel', up);
map.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
map.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-(e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.0016);
  zoomAt(e.clientX, e.clientY, f);
}, { passive: false });
$('#zin').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.3, true);
$('#zout').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.3, true);
$('#zfit').onclick = () => fitAll(true);
center.addEventListener('click', () => fitAll(true));

// --- panneau de détails ---
let current = null;
function fileLink(f) {
  const [p, line] = f.split('#');
  const label = p + (line ? ' · ligne ' + line.slice(1) : '');
  return `<li><a href="${REPO + p + (line ? '#' + line : '')}" target="_blank" rel="noopener">${esc(label)}</a></li>`;
}
function open(l) {
  if (current) current.el.classList.remove('sel');
  current = l; l.el.classList.add('sel');
  const b = l.branch;
  panel.style.setProperty('--c', `var(--c-${b.color})`);
  const spr = l.spr && sprite(l.spr);
  const links = (l.links || []).map(([t, u]) => `<li><a class="lk" href="${/^https?:/.test(u) ? u : REPO + u}" target="_blank" rel="noopener">${esc(t)}</a> <span>${/^https?:/.test(u) ? '' : esc(u)}</span></li>`).join('');
  const see = (l.see || []).filter(id => byId[id]).map(id => `<button type="button" data-go="${id}" style="--c: var(--c-${byId[id].branch.color})"><span class="st" data-s="${byId[id].s}"></span>${esc(byId[id].t)}</button>`).join('');
  panel.innerHTML = `
    <button type="button" class="close" aria-label="Fermer">×</button>
    <div class="eyebrow">${esc(b.t)}</div>
    <h2>${esc(l.t)}</h2>
    <div class="chip"><span class="st" data-s="${l.s}"></span>${STATES[l.s]} · ${esc(l.d)}</div>
    ${spr ? `<div class="hero"><img alt="${esc(l.t)}" src="${spr}"></div>` : ''}
    <p class="txt">${esc(l.txt || '')}</p>
    ${l.keys && l.keys.length ? `<h3>Repères</h3><ul class="keys">${l.keys.map(k => `<li>${esc(k)}</li>`).join('')}</ul>` : ''}
    ${l.files && l.files.length ? `<h3>Fichiers</h3><ul class="files">${l.files.map(fileLink).join('')}</ul>` : ''}
    ${links ? `<h3>Images et liens</h3><ul class="files">${links}</ul>` : ''}
    ${see ? `<h3>Voir aussi</h3><div class="see">${see}</div>` : ''}`;
  panel.hidden = false;
  panel.scrollTop = 0;
  $('.close', panel).onclick = close;
  panel.querySelectorAll('[data-go]').forEach(btn => btn.onclick = () => { const t = byId[btn.dataset.go]; open(t); t.el.focus({ preventScroll: true }); });
  try { history.replaceState(null, '', '#' + l.id); } catch (e) {}
  requestAnimationFrame(() => reveal(l));
}
function close() {
  panel.hidden = true;
  if (current) { current.el.classList.remove('sel'); current.el.focus({ preventScroll: true }); current = null; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) close(); });

// --- recherche et filtres d'état ---
const active = new Set();
const legend = $('#legend');
const counts = {};
BRANCHES.forEach(b => b.leaves.forEach(l => counts[l.s] = (counts[l.s] || 0) + 1));
Object.entries(STATES).forEach(([s, label]) => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.setAttribute('aria-pressed', 'false');
  btn.innerHTML = `<span class="st" data-s="${s}"></span>${label} <em>${counts[s] || 0}</em>`;
  btn.onclick = () => { active.has(s) ? active.delete(s) : active.add(s); btn.setAttribute('aria-pressed', active.has(s)); filter(); };
  legend.appendChild(btn);
});
const q = $('#q'), count = $('#count');
function matches(l, words) {
  if (active.size && !active.has(l.s)) return false;
  if (!words.length) return true;
  const hay = l._hay || (l._hay = norm([l.t, l.d, l.txt, l.branch.t, ...(l.keys || []), ...(l.files || [])].join(' ')));
  return words.every(w => hay.includes(w));
}
function filter() {
  const words = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  const on = words.length || active.size;
  let n = 0;
  BRANCHES.forEach(b => {
    let any = false;
    b.leaves.forEach(l => {
      const m = matches(l, words); if (m) { n++; any = true; }
      l.el.classList.toggle('dim', on && !m);
      l.el.classList.toggle('hit', !!words.length && m);
      l.twig.style.opacity = on && !m ? .15 : '';
    });
    b.el.classList.toggle('dim', on && !any);
    b.trunk.style.opacity = on && !any ? .15 : '';
  });
  count.textContent = on ? `${n} trouvé${n > 1 ? 's' : ''}` : '';
  return n;
}
q.addEventListener('input', filter);
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = BRANCHES.flatMap(b => b.leaves).find(l => !l.el.classList.contains('dim'));
  if (first) { open(first); first.el.focus({ preventScroll: true }); }
});

// --- démarrage ---
fitAll(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); filter(); if (!current) fitAll(false); });
const start = location.hash.slice(1);
if (byId[start]) open(byId[start]);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => current ? reveal(current) : fitAll(false), 150); });
</script>
</body>
</html>
