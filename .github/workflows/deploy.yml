# Met le jeu en ligne sur GitHub Pages à chaque mise à jour de main.
# Réglage nécessaire (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Mise en ligne (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule mise en ligne à la fois ; la plus récente l'emporte
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # les sprites sont déjà générés et versionnés : seule la construction Vite est nécessaire
      - run: npm run build
      # la carte mentale part en ligne avec le jeu : …/ninja-video-game/carte-mentale/
      - run: node tools/carte_mentale_verif.mjs --site dist/carte-mentale/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
